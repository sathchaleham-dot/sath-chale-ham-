<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Premium Impact | Sath Chale Hum Foundation</title>

<!-- Google Fonts: Premium Typography -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Tiro+Devanagari+Hindi&display=swap" rel="stylesheet">
<!-- Font Awesome -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<style>
  /* ═══════════════════════════════════════════════════════════
     PREMIUM DESIGN SYSTEM & VARIABLES
     ═══════════════════════════════════════════════════════════ */
  :root {
    --bg-dark: #050B14;
    --bg-card: rgba(15, 23, 42, 0.6);
    --border-glass: rgba(255, 255, 255, 0.08);
    --gold: #FBBF24;
    --gold-light: #FCD34D;
    --gold-dark: #D97706;
    --emerald: #10B981;
    --text-main: #F8FAFC;
    --text-muted: #94A3B8;
    --glow-gold: 0 0 30px rgba(251, 191, 36, 0.3);
    
    --font-display: 'Playfair Display', serif;
    --font-body: 'Plus Jakarta Sans', sans-serif;
    --font-hindi: 'Tiro Devanagari Hindi', serif;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: var(--font-body);
    background-color: var(--bg-dark);
    color: var(--text-main);
    min-height: 100vh;
    padding: 80px 20px;
    line-height: 1.6;
    overflow-x: hidden;
    position: relative;
  }

  /* Premium Mesh Background */
  body::before {
    content: "";
    position: fixed;
    top: -20%; left: -10%;
    width: 60vw; height: 60vw;
    background: radial-gradient(circle, rgba(251, 191, 36, 0.08) 0%, transparent 60%);
    border-radius: 50%;
    z-index: -1;
    pointer-events: none;
  }
  body::after {
    content: "";
    position: fixed;
    bottom: -20%; right: -10%;
    width: 70vw; height: 70vw;
    background: radial-gradient(circle, rgba(16, 185, 129, 0.05) 0%, transparent 60%);
    border-radius: 50%;
    z-index: -1;
    pointer-events: none;
  }

  .container {
    max-width: 1200px;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    gap: 100px;
    position: relative;
    z-index: 1;
  }

  /* Common Section Title */
  .sec-header {
    text-align: center;
    margin-bottom: 50px;
  }
  .sec-header .badge {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 8px 20px;
    background: rgba(251, 191, 36, 0.1);
    border: 1px solid rgba(251, 191, 36, 0.3);
    border-radius: 100px;
    color: var(--gold);
    font-size: 0.75rem;
    font-weight: 800;
    letter-spacing: 2px;
    text-transform: uppercase;
    margin-bottom: 16px;
    box-shadow: var(--glow-gold);
  }
  .sec-header h2 {
    font-family: var(--font-display);
    font-size: clamp(2rem, 4vw, 3rem);
    font-weight: 700;
    color: #fff;
    letter-spacing: -0.5px;
  }
  .sec-header h2 em {
    font-style: normal;
    font-family: var(--font-hindi);
    color: var(--gold);
    display: block;
    margin-top: 8px;
    font-size: clamp(1.5rem, 3vw, 2rem);
  }

  /* ═══════════════════════════════════════════════════════════
     1. IMPACT CALCULATOR
     ═══════════════════════════════════════════════════════════ */
  .calc-wrapper {
    background: var(--bg-card);
    border: 1px solid var(--border-glass);
    border-radius: 32px;
    backdrop-filter: blur(24px);
    -webkit-backdrop-filter: blur(24px);
    box-shadow: 0 40px 80px rgba(0, 0, 0, 0.6), inset 0 1px 0 rgba(255, 255, 255, 0.1);
    display: grid;
    grid-template-columns: 1fr 1fr;
    overflow: hidden;
  }

  /* Left Side: Controls */
  .calc-controls {
    padding: 50px;
    border-right: 1px solid var(--border-glass);
    display: flex;
    flex-direction: column;
    gap: 40px;
  }

  .premium-select-box {
    position: relative;
  }
  .premium-select-box label {
    display: block;
    font-size: 0.75rem;
    font-weight: 800;
    color: var(--text-muted);
    letter-spacing: 1.5px;
    text-transform: uppercase;
    margin-bottom: 12px;
  }
  .custom-select {
    width: 100%;
    appearance: none;
    padding: 18px 24px;
    border-radius: 16px;
    background: rgba(255, 255, 255, 0.03);
    border: 1px solid var(--border-glass);
    color: #fff;
    font-family: var(--font-hindi);
    font-size: 1.05rem;
    font-weight: 700;
    cursor: pointer;
    outline: none;
    transition: all 0.3s;
    box-shadow: inset 0 2px 4px rgba(0,0,0,0.2);
  }
  .custom-select:focus {
    border-color: var(--gold);
    box-shadow: 0 0 0 4px rgba(251, 191, 36, 0.15);
  }
  .custom-select option { background: #0F172A; color: #fff; padding: 10px; }
  .select-icon {
    position: absolute;
    right: 24px; top: 55px;
    color: var(--gold);
    pointer-events: none;
    font-size: 1.2rem;
  }

  /* Premium Slider & Amount */
  .premium-slider-box {
    position: relative;
  }
  .slider-header {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    margin-bottom: 20px;
  }
  .slider-header p {
    font-size: 0.75rem;
    font-weight: 800;
    color: var(--text-muted);
    letter-spacing: 1.5px;
    text-transform: uppercase;
  }
  .amount-display-wrap {
    position: relative;
  }
  /* Amount Font Preserved as Requested (Extra Bold & Premium) */
  .slider-header h1 {
    font-family: var(--font-display);
    font-size: 3.5rem;
    font-weight: 800; /* Extra Bold */
    color: var(--gold);
    line-height: 1;
    text-shadow: var(--glow-gold);
    transition: transform 0.2s cubic-bezier(0.2, 0.8, 0.3, 1.4);
  }
  .slider-header h1.pulse-amt {
    transform: scale(1.1);
  }
  
  /* New: 80G Badge */
  .trust-badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    margin-top: 10px;
    font-size: 0.7rem;
    font-weight: 700;
    color: var(--emerald);
    background: rgba(16, 185, 129, 0.1);
    padding: 4px 12px;
    border-radius: 100px;
    border: 1px solid rgba(16, 185, 129, 0.2);
  }

  /* Custom Slider with Progress Fill */
  .slider-track-wrapper {
    position: relative;
    height: 8px;
    margin: 25px 0 15px;
    border-radius: 10px;
    background: rgba(255, 255, 255, 0.08);
  }
  .slider-fill {
    position: absolute;
    top: 0; left: 0; height: 100%;
    width: 0%;
    border-radius: 10px;
    background: linear-gradient(90deg, var(--gold-dark), var(--gold), var(--gold-light));
    box-shadow: 0 0 15px rgba(251, 191, 36, 0.6);
    pointer-events: none;
    transition: width 0.1s;
  }
  .custom-slider {
    -webkit-appearance: none;
    position: absolute;
    top: -12px; left: 0;
    width: 100%;
    height: 32px;
    background: transparent;
    outline: none;
    cursor: pointer;
    z-index: 2;
  }
  .custom-slider::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 32px; height: 32px;
    border-radius: 50%;
    background: linear-gradient(135deg, #fff, #E2E8F0);
    border: 4px solid var(--gold);
    box-shadow: 0 0 20px rgba(251, 191, 36, 0.8), 0 10px 20px rgba(0,0,0,0.4);
    cursor: grab;
    transition: transform 0.2s, box-shadow 0.2s;
  }
  .custom-slider::-webkit-slider-thumb:hover {
    transform: scale(1.15);
    box-shadow: 0 0 30px rgba(251, 191, 36, 1), 0 10px 20px rgba(0,0,0,0.5);
  }

  /* New: Quick Amount Chips */
  .quick-chips {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    margin-bottom: 15px;
  }
  .chip {
    padding: 8px 16px;
    background: rgba(255, 255, 255, 0.03);
    border: 1px solid var(--border-glass);
    border-radius: 100px;
    color: var(--text-main);
    font-size: 0.8rem;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.3s;
  }
  .chip:hover {
    background: rgba(251, 191, 36, 0.1);
    border-color: var(--gold);
    color: var(--gold);
  }
  .chip.active {
    background: var(--gold);
    color: #000;
    border-color: var(--gold);
    box-shadow: 0 0 15px rgba(251, 191, 36, 0.5);
  }

  .slider-ticks {
    display: flex;
    justify-content: space-between;
    font-size: 0.7rem;
    font-weight: 700;
    color: var(--text-muted);
  }
  .slider-ticks span.active { color: var(--gold); font-weight: 800; }

  /* Right Side: Live Preview */
  .calc-preview {
    padding: 50px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
    background: radial-gradient(circle at center, rgba(251, 191, 36, 0.05), transparent 70%);
    position: relative;
  }
  .preview-icon {
    width: 90px; height: 90px;
    border-radius: 50%;
    background: rgba(251, 191, 36, 0.1);
    border: 1px solid rgba(251, 191, 36, 0.3);
    display: grid; place-items: center;
    font-size: 2.5rem;
    color: var(--gold);
    margin-bottom: 30px;
    box-shadow: 0 0 40px rgba(251, 191, 36, 0.2), inset 0 0 20px rgba(251, 191, 36, 0.1);
    animation: floatIcon 3s ease-in-out infinite;
  }
  @keyframes floatIcon {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-10px); }
  }
  .preview-text-hi {
    font-family: var(--font-hindi);
    font-size: 1.5rem;
    font-weight: 700;
    line-height: 1.6;
    color: #fff;
    margin-bottom: 12px;
  }
  .preview-text-hi strong { color: var(--gold); font-size: 1.6rem; }
  .preview-text-en {
    font-size: 0.95rem;
    color: var(--text-muted);
    font-style: italic;
    max-width: 80%;
    margin: 0 auto;
  }

  /* ═══════════════════════════════════════════════════════════
     RESPONSIVE DESIGN
     ═══════════════════════════════════════════════════════════ */
  @media (max-width: 992px) {
    .calc-wrapper { grid-template-columns: 1fr; }
    .calc-controls { border-right: none; border-bottom: 1px solid var(--border-glass); padding: 30px; }
    .calc-preview { padding: 40px 30px; }
  }
  @media (max-width: 768px) {
    .slider-header h1 { font-size: 3rem; }
    .preview-text-hi { font-size: 1.2rem; }
    .preview-text-hi strong { font-size: 1.3rem; }
  }
</style>
</head>
<body>

<!-- SVG Gradients -->
<svg width="0" height="0">

<div class="container">

  <!-- 1. IMPACT CALCULATOR -->

        <!-- Amount & Slider -->
        <div class="premium-slider-box">
          <div class="slider-header">
            <div>
              <p>Your Contribution / आपका सहयोग</p>
              <div class="trust-badge"><i class="fa-solid fa-shield-check"></i> 80G Tax Exemption</div>

            <h1 id="calcAmount">₹1</h1>

          <!-- Quick Chips -->
          <div class="quick-chips" id="quickChips">
            <button class="chip" data-amt="500">₹500</button>

            <button class="chip" data-amt="5000">₹5K</button>

          <!-- Slider with Golden Fill -->
          <div class="slider-track-wrapper">
            <div class="slider-fill" id="sliderFill"></div>
            <input type="range" class="custom-slider" id="calcSlider" min="1" max="15000" value="1" step="1">
          </div>
          
          <div class="slider-ticks" id="calcMarks">
            <span data-val="1" class="active">₹1</span>
            <span data-val="5000">₹5K</span>
            <span data-val="10000">₹10K</span>
            <span data-val="15000">₹15K</span>
          </div>
        </div>

      </div>

      <!-- Right Side: Live Preview -->
      <div class="calc-preview">
        <div class="preview-icon" id="calcIcon">
          <i class="fa-solid fa-book-open-reader"></i>
        </div>
        <div class="preview-text-hi" id="calcText">
          आपके <strong>₹1</strong> से किसी बच्चे को <strong>एक पेन</strong> मिल सकती है।
        </div>
        <div class="preview-text-en" id="calcTextEn">
          Your ₹1 can provide a pen to a child.
        </div>
      </div>

    </div>
  </section>

</div>

  function updateCalc(val) {
    const v = parseInt(val, 10);
    const wk = cw.value;
    const data = workImpacts[wk] || workImpacts[1];
    
    // Update Amount with Pulse Animation
    ca.textContent = "₹" + v.toLocaleString("en-IN");
    ca.classList.remove("pulse-amt");
    void ca.offsetWidth; // Trigger reflow
    ca.classList.add("pulse-amt");

    // Update Slider Fill
    const pct = ((v - 1) / (15000 - 1)) * 100;
    sliderFill.style.width = pct + "%";
    
    // Update Marks
    cm.forEach(m => {
      m.classList.toggle("active", v >= parseInt(m.dataset.val));
    });

    // Update Chips
    chips.forEach(c => {
      c.classList.toggle("active", parseInt(c.dataset.amt) === v);
    });
    
    // Update Preview Text
    let found = data.tiers[data.tiers.length - 1];
    for (let i = 0; i < data.tiers.length; i++) {
      if (v <= data.tiers[i].max) { found = data.tiers[i]; break; }
    }
    
    let n = Math.max(1, Math.floor(v / 20));
    ct.innerHTML = found.hi.replace(/\{amt\}/g, v.toLocaleString("en-IN")).replace(/\{n\}/g, n);
    cte.textContent = found.en.replace(/\{n\}/g, n);
    ci.innerHTML = `<i class="fa-solid ${data.icon}"></i>`;
  }

  if(cs) cs.addEventListener("input", (e) => updateCalc(e.target.value));
  if(cw) cw.addEventListener("change", () => updateCalc(cs.value));
  
  // Quick Chip Listeners
  chips.forEach(chip => {
    chip.addEventListener("click", () => {
      const amt = parseInt(chip.dataset.amt);
      cs.value = amt;
      updateCalc(amt);
    });
  });

  // Initialize
  updateCalc(1);

});
